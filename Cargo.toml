[workspace]
members = [
    "backend",
    "contracts/crucible",
    "contracts/treasury",
    "contracts/proxy",
    "contracts/oracle",
    "contracts/zk_verifier",
    "crucible-macros",
    "examples/counter",
    "examples/token",
    "examples/vesting",
    "examples/staking",
    "examples/time_locked_vault",
    "examples/emergency_stop",
    "examples/emergency-circuit-breaker",
    "examples/gasless",
    "examples/cross-contract",
    "examples/lending",
    "examples/prediction-market",
    "examples/escrow-multi-arbiter",
    "examples/flash-mint",
    "examples/amm-pool",
    "examples/bounty-escrow",
    "examples/dex",
    "examples/escrow",
    "examples/gaming-crafting",
    "examples/insurance-mutual",
    "examples/liquid-staking",
    "examples/lottery",
    "examples/multisig",
    "examples/nft-marketplace",
    "examples/nft-rental",
    "examples/options-protocol",
    "examples/payment-streaming",
    "examples/portfolio-index",
    "examples/quadratic-funding",
    "examples/reputation",
    "examples/smart-wallet",
    "examples/vault",
    "examples/yield-vault",
]
exclude = [
    "contracts/supply_chain",
    "contracts/governance",
    "contracts/insurance",
]
resolver = "2"

[workspace.package]
version = "1.36.20"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"
description = "A batteries-included testing toolkit for Soroban smart contracts."
repository = "https://github.com/benelabs/crucible"
homepage = "https://github.com/benelabs/crucible"
authors = ["Crucible Contributors"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
crucible-macros = { path = "crucible-macros", version = "1.16.0" }
