[server]
host = "0.0.0.0"
port = 8080
request_timeout_ms = 30000
max_connections = 1000
http2_max_concurrent_streams = 100

[database]
max_connections = 10
min_connections = 1
connect_timeout_secs = 3
idle_timeout_secs = 600
pool_retry_after_secs = 5

[redis]
pool_size = 10
connection_timeout_ms = 5000
max_retries = 3
startup_timeout_ms = 30000

[cors]
allowed_origins = ["*"]

[observability]
log_level = "info"
tracing_endpoint = "http://localhost:4318/v1/traces"
enable_metrics = false

[sandbox]
max_wasm_bytes = 2097152
max_args = 32
max_arg_xdr_bytes = 65536
max_cpu_instructions = 25000000
max_memory_bytes = 67108864
timeout_ms = 2000
min_ledger_sequence = 1
max_ledger_sequence = 1000000000
min_ledger_timestamp = 1000000000
max_ledger_timestamp = 4102444800
max_concurrent_executions = 32
max_wasm_imports = 128
max_wasm_table_entries = 100000
