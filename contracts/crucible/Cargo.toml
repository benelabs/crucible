[package]
name = "crucible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soroban", "stellar", "testing", "smart-contracts", "test-utils"]
categories = ["development-tools::testing"]


[lib]
crate-type = ["rlib"]

[features]
std = []
snapshots = ["std", "serde", "serde_json"]
default = ["derive"]
derive = ["dep:crucible-macros"]
full = ["snapshots", "derive"]


[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-env-host = "26.1.3"
crucible-macros = { workspace = true, optional = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "arithmetic", "pkcs8"] }
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
static_assertions = "1.1.0"
arbitrary = { version = "1.3", features = ["derive"] }
